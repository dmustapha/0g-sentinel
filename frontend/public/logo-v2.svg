<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 24" fill="none">
  <!-- Wordmark: 0G SENTINEL -->
  <!-- Small node accent before text -->
  <circle cx="6" cy="12" r="3" fill="#00d4ff" opacity="0.9"/>
  <circle cx="6" cy="12" r="1.25" fill="#050810"/>
  <line x1="11" y1="12" x2="15" y2="12" stroke="#00d4ff" stroke-width="0.75" opacity="0.4"/>
  <!-- "0G" bold -->
  <text x="17" y="16.5" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="-0.03em">0G</text>
  <!-- Separator -->
  <line x1="44" y1="5" x2="44" y2="19" stroke="#1e2d4a" stroke-width="1"/>
  <!-- "Sentinel" -->
  <text x="49" y="16.5" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="500" fill="#00d4ff" letter-spacing="0.08em">SENTINEL</text>
</svg>
