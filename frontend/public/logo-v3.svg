  <!-- Sentinel label -->
  <text x="70" y="16" font-family="'Space Grotesk', sans-serif" font-size="7.5" font-weight="600" fill="#64748b" letter-spacing="0.18em" text-transform="uppercase">SENTINEL</text>
  <text x="70" y="26" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="400" fill="rgba(0,212,255,0.5)" letter-spacing="0.1em">ATTESTATION INFRA</text>
</svg>
